org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The same settings as HaBytes, which builds with these versions.
android.newDsl=false
android.builtInKotlin=false

# Never try to download SDK components (the Nix store is read-only).
android.builder.sdkDownload=false
